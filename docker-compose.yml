# ============================================
# DOCKER-COMPOSE
# ============================================

version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: commerce_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: commerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: commerce_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth_service
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:password@postgres:5432/commerce_db?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3010,http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth-service/src:/app/src

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order_service
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://postgres:password@postgres:5432/commerce_db?schema=order_schema
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3010,http://localhost:3000
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/order-service/src:/app/src

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product_service
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://postgres:password@postgres:5432/commerce_db?schema=product_schema
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3010,http://localhost:3000
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/product-service/src:/app/src

  # Inventory Service
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: inventory_service
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://postgres:password@postgres:5432/commerce_db?schema=inventory_schema
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3010,http://localhost:3000
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/inventory-service/src:/app/src

  # Delivery Service
  delivery-service:
    build:
      context: .
      dockerfile: services/delivery-service/Dockerfile
    container_name: delivery_service
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: postgresql://postgres:password@postgres:5432/commerce_db?schema=delivery_schema
      REDIS_URL: redis://redis:6379
      ORDER_SERVICE_URL: http://order-service:3002
      CORS_ORIGIN: http://localhost:3010,http://localhost:3000
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/delivery-service/src:/app/src

  # Warehouse Service
  warehouse-service:
    build:
      context: .
      dockerfile: services/warehouse-service/Dockerfile
    container_name: warehouse_service
    environment:
      NODE_ENV: development
      PORT: 3006
      DATABASE_URL: postgresql://postgres:password@postgres:5432/commerce_db?schema=warehouse_schema
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3010,http://localhost:3000
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory-service:
        condition: service_started
    volumes:
      - ./services/warehouse-service/src:/app/src

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification_service
    environment:
      NODE_ENV: development
      PORT: 3008
      DATABASE_URL: postgresql://postgres:password@postgres:5432/commerce_db?schema=notification_schema
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3010,http://localhost:3000
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/api/notifications/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./services/notification-service/src:/app/src

  # Warehouse Dashboard (Next.js)
  warehouse-dashboard:
    build:
      context: .
      dockerfile: apps/web/warehouse-dashboard/Dockerfile
    container_name: warehouse_dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost
    ports:
      - "3010:3010"
    depends_on:
      - auth-service
      - order-service
      - product-service

  # API Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: api_gateway
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - order-service
      - product-service
      - inventory-service
      - delivery-service
      - warehouse-service
      - notification-service

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - auth-service
      - order-service
      - product-service
      - inventory-service
      - delivery-service
      - warehouse-service
      - notification-service
      - warehouse-dashboard

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: commerce_network
