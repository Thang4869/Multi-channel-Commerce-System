name: Inventory integration tests

on:
  push:
    branches: [ main, 'feat/*', 'fix/*', 'chore/*' ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inventory-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Set Yarn registry
        run: yarn config set registry https://registry.npmjs.org

      - name: Install dependencies
        working-directory: services/inventory-service
        run: |
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Generate Prisma client
        working-directory: services/inventory-service
        run: |
          yarn prisma:generate

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if nc -z localhost 6379; then echo "redis up" && break; fi
            echo "waiting for redis..."; sleep 1;
          done

      - name: Run inventory tests
        working-directory: services/inventory-service
        env:
          REDIS_URL: redis://localhost:6379
          NODE_ENV: ci
        run: |
          yarn test --runInBand
