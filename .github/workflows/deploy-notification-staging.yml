name: Deploy Notification Service to Staging

on:
  workflow_dispatch:
    inputs:
      deploy_host:
        description: Staging host for notification service deployment
        required: true
        type: string
      deploy_user:
        description: SSH user for the staging host
        required: true
        type: string
      deploy_ssh_key:
        description: SSH private key for the staging host
        required: true
        type: string
  push:
    branches:
      - feat/notification-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: services/notification-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/notification-service:${{ github.sha }}

  deploy-via-ssh:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ inputs.deploy_host }}
          DEPLOY_USER: ${{ inputs.deploy_user }}
          DEPLOY_SSH_KEY: ${{ inputs.deploy_ssh_key }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing one or more deployment secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY"
            exit 1
          fi

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ inputs.deploy_ssh_key }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pull image and restart container on staging host
        env:
          DEPLOY_HOST: ${{ inputs.deploy_host }}
          DEPLOY_USER: ${{ inputs.deploy_user }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker pull ghcr.io/${{ github.repository_owner }}/notification-service:${{ github.sha }} && \
             docker stop notification_service || true && \
             docker rm notification_service || true && \
             docker run -d --name notification_service -p 3008:3008 --env-file /home/deploy/envs/notification.env ghcr.io/${{ github.repository_owner }}/notification-service:${{ github.sha }}"

    # Note: ensure secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY are configured in repository settings.
