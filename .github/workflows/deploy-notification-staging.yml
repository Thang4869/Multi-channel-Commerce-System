name: Deploy Notification Service to Staging

on:
  workflow_dispatch:
  push:
    branches:
      - feat/notification-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: services/notification-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/notification-service:${{ github.sha }}

  deploy-via-ssh:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.DEPLOY_HOST && secrets.DEPLOY_USER && secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pull image and restart container on staging host
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker pull ghcr.io/${{ github.repository_owner }}/notification-service:${{ github.sha }} && \
             docker stop notification_service || true && \
             docker rm notification_service || true && \
             docker run -d --name notification_service -p 3008:3008 --env-file /home/deploy/envs/notification.env ghcr.io/${{ github.repository_owner }}/notification-service:${{ github.sha }}"

    # Note: ensure secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY are configured in repository settings.
