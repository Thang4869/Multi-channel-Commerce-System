name: Monorepo CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  service-tests:
    name: Run tests per service
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          "services/auth-service",
          "services/order-service",
          "services/product-service",
          "services/inventory-service",
          "services/delivery-service",
          "services/warehouse-service",
          "services/notification-service",
          "apps/web/warehouse-dashboard"
        ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Cache Yarn
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Set Yarn registry
        run: yarn config set registry https://registry.npmjs.org

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f package.json ]; then yarn install --non-interactive --network-timeout 600000; fi

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f package.json ] && yarn -s lint >/dev/null 2>&1; then yarn lint || exit 1; else echo 'no lint script'; fi

      - name: Security audit
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f package.json ]; then npm audit --audit-level=high || echo 'audit issues (see logs)'; fi

      - name: Prisma generate (if exists)
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f prisma/schema.prisma ]; then yarn prisma:generate || true; fi

      - name: Run tests
        working-directory: ${{ matrix.service }}
        env:
          CI: true
        run: |
          if [ -f package.json ]; then
            if node -e "const pkg = require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)"; then
              if yarn test --silent --passWithNoTests; then
                echo 'tests OK'
              else
                exit 1
              fi
            else
              echo 'no test script'
            fi
          fi

      - name: Build (if script exists)
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f package.json ]; then yarn build || echo 'no build'; fi

  build-images:
    name: Build & Push Docker images (main only)
    runs-on: ubuntu-latest
    needs: service-tests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set lowercase image owner
        id: set_owner
        run: |
          echo "owner=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ steps.set_owner.outputs.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/auth-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.set_owner.outputs.owner }}/auth-service:${{ github.sha }}

      - name: Build product-service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/product-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.set_owner.outputs.owner }}/product-service:${{ github.sha }}

      - name: Build inventory-service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/inventory-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.set_owner.outputs.owner }}/inventory-service:${{ github.sha }}

      - name: Build delivery-service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/delivery-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.set_owner.outputs.owner }}/delivery-service:${{ github.sha }}

      - name: Build warehouse-service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/warehouse-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.set_owner.outputs.owner }}/warehouse-service:${{ github.sha }}

      - name: Build notification-service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/notification-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.set_owner.outputs.owner }}/notification-service:${{ github.sha }}
