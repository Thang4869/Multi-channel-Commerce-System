name: Canary Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      deploy_host:
        description: Staging host for canary deployment
        required: true
        type: string
      deploy_user:
        description: SSH user for the staging host
        required: true
        type: string
      deploy_ssh_key:
        description: SSH private key for the staging host
        required: true
        type: string
  push:
    branches:
      - main

jobs:
  canary:
    name: Canary deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images for canary
        uses: docker/build-push-action@v4
        with:
          context: .
          file: services/notification-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/notification-service:canary-${{ github.sha }}

      - name: Deploy canary on staging host
        env:
          DEPLOY_SSH_KEY: ${{ inputs.deploy_ssh_key }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pull & run canary container
        env:
          DEPLOY_HOST: ${{ inputs.deploy_host }}
          DEPLOY_USER: ${{ inputs.deploy_user }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker pull ghcr.io/${{ github.repository_owner }}/notification-service:canary-${{ github.sha }} && \
             docker stop notification_service_canary || true && \
             docker rm notification_service_canary || true && \
             docker run -d --name notification_service_canary -p 3009:3008 --env-file /home/deploy/envs/notification.env ghcr.io/${{ github.repository_owner }}/notification-service:canary-${{ github.sha }}"

      - name: Verify canary on remote and rollback on failure
        env:
          DEPLOY_HOST: ${{ inputs.deploy_host }}
          DEPLOY_USER: ${{ inputs.deploy_user }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "set -e; echo 'Waiting for canary to become healthy...'; for i in 1 2 3 4 5; do if curl -sSf http://localhost:3009/api/notifications/health -m 5 >/dev/null; then echo 'Canary healthy'; exit 0; else echo \"Attempt $i: canary not ready, retrying...\"; sleep 5; fi; done; echo 'Canary verification failed, rolling back'; docker stop notification_service_canary || true; docker rm notification_service_canary || true; exit 1"
