name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: commerce_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/commerce_db?schema=public

    # Auth Service
    - name: Lint Auth Service
      run: cd services/auth-service && yarn lint || true
      continue-on-error: true

    - name: Build Auth Service
      run: cd services/auth-service && yarn build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/commerce_db?schema=public
        JWT_SECRET: test-secret
        JWT_REFRESH_SECRET: test-refresh-secret

    # Order Service
    - name: Lint Order Service
      run: cd services/order-service && yarn lint || true
      continue-on-error: true

    - name: Build Order Service
      run: cd services/order-service && yarn build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/commerce_db?schema=order_schema
        JWT_SECRET: test-secret

    # Product Service
    - name: Build Product Service
      run: cd services/product-service && yarn build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/commerce_db?schema=product_schema

    # Inventory Service
    - name: Build Inventory Service
      run: cd services/inventory-service && yarn build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/commerce_db?schema=inventory_schema

    # Delivery Service
    - name: Build Delivery Service
      run: cd services/delivery-service && yarn build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/commerce_db?schema=delivery_schema

    # Warehouse Service
    - name: Build Warehouse Service
      run: cd services/warehouse-service && yarn build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/commerce_db?schema=warehouse_schema

    # Notification Service
    - name: Build Notification Service
      run: cd services/notification-service && yarn build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/commerce_db?schema=notification_schema

    # Warehouse Dashboard
    - name: Build Warehouse Dashboard
      run: cd apps/web/warehouse-dashboard && yarn build
      env:
        NEXT_PUBLIC_API_URL: http://localhost

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Auth Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/auth-service/Dockerfile
        push: false
        tags: commerce/auth-service:latest

    - name: Build Order Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/order-service/Dockerfile
        push: false
        tags: commerce/order-service:latest

    - name: Build Product Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/product-service/Dockerfile
        push: false
        tags: commerce/product-service:latest

    - name: Build Inventory Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/inventory-service/Dockerfile
        push: false
        tags: commerce/inventory-service:latest

    - name: Build Delivery Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/delivery-service/Dockerfile
        push: false
        tags: commerce/delivery-service:latest

    - name: Build Warehouse Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/warehouse-service/Dockerfile
        push: false
        tags: commerce/warehouse-service:latest

    - name: Build Notification Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/notification-service/Dockerfile
        push: false
        tags: commerce/notification-service:latest

    - name: Build Warehouse Dashboard Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: apps/web/warehouse-dashboard/Dockerfile
        push: false
        tags: commerce/warehouse-dashboard:latest
