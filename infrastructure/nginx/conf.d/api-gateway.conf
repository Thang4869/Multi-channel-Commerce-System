# ============================================
# NGINX - API GATEWAY ENHANCED CONFIGURATION
# ============================================
# Enhanced routing with:
# - Authentication validation
# - Rate limiting
# - CORS headers
# - Security headers
# - Request/response logging
# ============================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=heavy_limit:10m rate=2r/s;

# Upstream Services with Health Checks
upstream auth_service {
    server auth-service:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream order_service {
    server order-service:3002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream product_service {
    server product-service:3003 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream inventory_service {
    server inventory-service:3004 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream delivery_service {
    server delivery-service:3005 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream warehouse_service {
    server warehouse-service:3006 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream notification_service {
    server notification-service:3008 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream warehouse_dashboard {
    server warehouse-dashboard:3010 max_fails=2 fail_timeout=30s;
    keepalive 32;
}

# Map for authentication requirement
map $request_path $auth_required {
    default 1;
    ~^/api/auth/(login|register|refresh)$ 0;
    ~^/health$ 0;
    ~^/api/docs$ 0;
}

# Map for rate limit zone selection
map $request_path $limit_zone {
    default "api_limit";
    ~^/api/auth 'auth_limit';
    ~^/api/warehouses/distribution 'heavy_limit';
    ~^/api/inventory/lock 'heavy_limit';
}

# Server block with API Gateway routing
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CORS headers
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "86400" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Rate limiting
    limit_req zone=$limit_zone burst=20 nodelay;

    # Request ID for tracing
    map $http_x_request_id $request_id_local {
        default $http_x_request_id;
        "" $request_time-$msec;
    }

    # ========== Authentication Service ==========
    location ~ ^/api/auth/?(.*) {
        proxy_pass http://auth_service/$1$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_local;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        access_log /var/log/nginx/auth_service.log main;
    }

    # ========== Order Service ==========
    location ~ ^/api/orders/?(.*) {
        # Require authentication
        if ($auth_required = 1) {
            # Check for Authorization header
            if ($http_authorization = "") {
                return 401;
            }
        }
        
        proxy_pass http://order_service/$1$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_local;
        proxy_set_header Authorization $http_authorization;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        access_log /var/log/nginx/order_service.log main;
    }

    # ========== Product Service ==========
    location ~ ^/api/(products|categories|brands)/?(.*) {
        proxy_pass http://product_service/$0$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_local;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        access_log /var/log/nginx/product_service.log main;
    }

    # ========== Inventory Service ==========
    location ~ ^/api/inventory/?(.*) {
        if ($auth_required = 1) {
            if ($http_authorization = "") {
                return 401;
            }
        }
        
        proxy_pass http://inventory_service/$1$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_local;
        proxy_set_header Authorization $http_authorization;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        
        access_log /var/log/nginx/inventory_service.log main;
    }

    # ========== Delivery Service ==========
    location ~ ^/api/deliveries/?(.*) {
        if ($auth_required = 1) {
            if ($http_authorization = "") {
                return 401;
            }
        }
        
        proxy_pass http://delivery_service/$1$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_local;
        proxy_set_header Authorization $http_authorization;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        access_log /var/log/nginx/delivery_service.log main;
    }

    # ========== Warehouse Service ==========
    location ~ ^/api/warehouses/?(.*) {
        if ($auth_required = 1) {
            if ($http_authorization = "") {
                return 401;
            }
        }
        
        proxy_pass http://warehouse_service/$1$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_local;
        proxy_set_header Authorization $http_authorization;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        
        access_log /var/log/nginx/warehouse_service.log main;
    }

    # ========== Notification Service ==========
    location ~ ^/api/notifications/?(.*) {
        if ($auth_required = 1) {
            if ($http_authorization = "") {
                return 401;
            }
        }
        
        proxy_pass http://notification_service/$1$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_local;
        proxy_set_header Authorization $http_authorization;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        access_log /var/log/nginx/notification_service.log main;
    }

    # ========== API Documentation ==========
    location ~ ^/api/docs/?(.*) {
        proxy_pass http://auth_service/api/docs/$1$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        
        access_log off;
    }

    # ========== Dashboard (Next.js) ==========
    location / {
        proxy_pass http://warehouse_dashboard;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ========== Health Check ==========
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ========== Metrics (optional) ==========
    location /nginx-status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # ========== Error Pages ==========
    error_page 401 /errors/401.json;
    error_page 404 /errors/404.json;
    error_page 500 502 503 504 /errors/5xx.json;

    location /errors/ {
        default_type application/json;
        internal;
    }
}
